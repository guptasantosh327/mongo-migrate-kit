<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="856" height="300" viewBox="0 0 856 300" role="img" aria-label="A migration makes two writes and the second one fails. Without a transaction the first write stays in the database. With useTransaction both are rolled back.">
<style>
.dg{--bg:#f5f8f6;--card:#fff;--line:#cdd6d2;--tx:#1c2521;--mut:#5d6a64;--acc:#00875c;--accs:#d8f3e5;--bad:#c2410c;--bads:#fde6dc;--wrn:#9a6700;--wrns:#fff1cc;--f:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--fm:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){.dg{--bg:#171b1a;--card:#1f2523;--line:#3a4541;--tx:#e4eae7;--mut:#9aa7a1;--acc:#3ddc84;--accs:#143a28;--bad:#ff8a65;--bads:#3d2018;--wrn:#e6b84f;--wrns:#3a2e12}}
html .dg{--bg:var(--vp-c-bg-soft);--card:var(--vp-c-bg);--line:var(--vp-c-divider);--tx:var(--vp-c-text-1);--mut:var(--vp-c-text-2);--acc:var(--vp-c-brand-1);--accs:var(--vp-c-brand-soft);--bad:var(--vp-c-danger-1);--bads:var(--vp-c-danger-soft);--wrn:var(--vp-c-warning-1);--wrns:var(--vp-c-warning-soft);--f:var(--vp-font-family-base);--fm:var(--vp-font-family-mono)}
.dg text{font-family:var(--f);fill:var(--tx)}
.dg .m{font-family:var(--fm);font-size:13px}
.dg .s{font-size:12.5px;fill:var(--mut)}
.dg .h{font-size:15px;font-weight:600}
.dg .ch{font-size:13.5px;font-weight:600}
.dg .card{fill:var(--card);stroke:var(--line)}
.dg .hit{fill:var(--accs);stroke:var(--acc);stroke-width:1.5}
.dg .hitt{fill:var(--acc);font-weight:600}
.dg .ok{fill:var(--mut);font-size:13px}
.dg .ar{fill:none;stroke:var(--mut);stroke-width:1.5}
.dg .arh{fill:var(--mut)}
.dg .num{fill:var(--acc)}
.dg .numt{fill:var(--card);font-size:12px;font-weight:700}
.dg .bgc{fill:var(--bg)}
.dg .badb{fill:var(--bads);stroke:var(--bad);stroke-width:1.5}
.dg .badt{fill:var(--bad);font-weight:600}
.dg .wrnb{fill:var(--wrns);stroke:var(--wrn);stroke-width:1.5}
.dg .wrnt{fill:var(--wrn);font-weight:600}
.dg .okt{fill:var(--acc);font-weight:600}
.dg .rule{stroke:var(--line)}
</style>
<defs><marker id="tx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bgc" width="856" height="300" rx="14"/>
<text class="h" x="24" y="36">When a migration fails halfway</text>
<text class="s" x="24" y="56">The same migration twice: write 1 works, write 2 throws a duplicate key error.</text>

<text class="ch" x="24" y="104">Without a transaction</text>
<text class="s" x="24" y="122">the default</text>
<rect class="card" x="232" y="80" width="180" height="56" rx="10"/>
<text class="m" x="248" y="103">1. updateMany(…)</text>
<text class="s okt" x="248" y="123">✓ written</text>
<path class="ar" d="M416 108H436" marker-end="url(#tx-arrow)"/>
<rect class="badb" x="440" y="80" width="180" height="56" rx="10"/>
<text class="m" x="456" y="103">2. insertMany(…)</text>
<text class="s badt" x="456" y="123">✖ throws E11000</text>
<path class="ar" d="M624 108H644" marker-end="url(#tx-arrow)"/>
<rect class="wrnb" x="648" y="80" width="184" height="56" rx="10"/>
<text class="s wrnt" x="664" y="103" style="font-size:13px">Write 1 stays.</text>
<text class="s" x="664" y="123">Clean up, then rerun.</text>

<line class="rule" x1="24" y1="160" x2="832" y2="160"/>

<text class="ch" x="24" y="208">With a transaction</text>
<text class="m s" x="24" y="226">useTransaction = true</text>
<rect class="card" x="232" y="184" width="180" height="56" rx="10"/>
<text class="m" x="248" y="207">1. updateMany(…)</text>
<text class="s" x="248" y="227">written, not committed</text>
<path class="ar" d="M416 212H436" marker-end="url(#tx-arrow)"/>
<rect class="badb" x="440" y="184" width="180" height="56" rx="10"/>
<text class="m" x="456" y="207">2. insertMany(…)</text>
<text class="s badt" x="456" y="227">✖ throws E11000</text>
<path class="ar" d="M624 212H644" marker-end="url(#tx-arrow)"/>
<rect class="hit" x="648" y="184" width="184" height="56" rx="10"/>
<text class="s okt" x="664" y="207" style="font-size:13px">Both are rolled back.</text>
<text class="s" x="664" y="227">Fix the file, then rerun.</text>

<text class="s" x="24" y="280">Either way the run stops at the failed file, it stays pending, and later files don't run.</text>
</svg>

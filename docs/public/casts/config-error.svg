<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="868" height="283" viewBox="0 0 868 283" role="img" aria-label="A configuration error that names every problem and how to fix it">
<title>A configuration error that names every problem and how to fix it</title>
<style>
svg{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:14px}
text{white-space:pre;fill:#d5dde3}
.k{fill:#7f8b93}.r{fill:#ff7b72}.g{fill:#4fd27f}.y{fill:#e6b84f}.b{fill:#79b8ff}.m{fill:#d2a8ff}.c{fill:#5fd0dc}.w{fill:#f3f6f8}
.d{fill-opacity:.62}.o{font-weight:700}
.p{fill:#3ddc84;font-weight:700}.cm{fill:#7d8a92}
.t{fill:#8a969e;font-size:12.5px}.lb{fill:#8a969e;font-size:12px}
.cur{fill:#d5dde3;animation:blink 1.05s step-end infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.sp{opacity:0;animation:spin .8s step-end infinite}
@keyframes spin{0%{opacity:1}10%{opacity:0}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){.sc0{transform:translateY(-0px)}}
@media (prefers-reduced-motion:reduce){.l,.cg,.sp{animation:none!important}.fin{opacity:1}.spl,.cg{opacity:0}}</style>
<rect x=".5" y=".5" width="867" height="282" rx="10" fill="#0f1417" stroke="#2a3238"/>
<path d="M10.5 .5h847a10 10 0 0 1 10 10v23.5h-867v-23.5a10 10 0 0 1 10-10z" fill="#1a2024"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text class="t" x="434" y="21.5" text-anchor="middle">~/shop-api</text>
<clipPath id="clip0"><rect x="0" y="34" width="867.6" height="246"/></clipPath>
<g clip-path="url(#clip0)"><g class="sc0">
<g class="l fin"><text x="18" y="61"><tspan class="p">$</tspan><tspan x="34.8"><tspan>MMK_LOCK_TTL=abc npx mmk up</tspan></tspan></text></g>
<g class="l fin"><text y="78"><tspan x="18.0" class="r">✖ CONFIG_INVALID: Invalid mongo-migrate-kit configuration — 2 problems found:</tspan></text></g>
<g class="l fin"><text y="95"></text></g>
<g class="l fin"><text y="112"><tspan x="18.0" class="r">  1. lockTTLSeconds must be a whole number, e.g. 60</tspan></text></g>
<g class="l fin"><text y="129"><tspan x="18.0" class="r">     Received: "abc"</tspan></text></g>
<g class="l fin"><text y="146"><tspan x="18.0" class="r">     Read from: the MMK_LOCK_TTL environment variable</tspan></text></g>
<g class="l fin"><text y="163"><tspan x="18.0" class="r">     Set it with: the MMK_LOCK_TTL environment variable, "lockTTLSeconds" in mmk.config.js, or the</tspan></text></g>
<g class="l fin"><text y="180"><tspan x="18.0">       </tspan><tspan x="76.8" class="r">config object passed to MigratorKit</tspan></text></g>
<g class="l fin"><text y="197"></text></g>
<g class="l fin"><text y="214"><tspan x="18.0" class="r">  2. uri is required but was not set</tspan></text></g>
<g class="l fin"><text y="231"><tspan x="18.0" class="r">     Set it with: the --uri &lt;uri&gt; CLI flag, the MMK_URI environment variable, "uri" in</tspan></text></g>
<g class="l fin"><text y="248"><tspan x="18.0">       </tspan><tspan x="76.8" class="r">mmk.config.js, or the config object passed to MigratorKit</tspan></text></g>
<g class="l fin"><text x="18" y="265"><tspan class="p">$</tspan><tspan x="34.8"><tspan></tspan></tspan></text></g>
</g></g>
</svg>
